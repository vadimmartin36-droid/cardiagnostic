name: Build and Release Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build environment (Keystore & Env)
        run: |
          # Ensure .env exists
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          
          # Ensure debug.keystore exists
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK as Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: CarDiagnostic-AI-v1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: CarDiagnostic AI v1.0.0 (APK)
          body: |
            ### 🚗 CarDiagnostic AI — Android APK
            Готовый установочный файл приложения для Android.
            
            **Инструкция по установке:**
            1. Скачайте прикрепленный файл `app-debug.apk`.
            2. Откройте его на Android смартфоне и нажмите **Установить**.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
